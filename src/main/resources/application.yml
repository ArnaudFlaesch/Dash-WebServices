# Shared configuration, with defaults for local development (database "dash" and Dash-MockServer).
# Environment-specific values are overridden in application-<profile>.yml.
server:
  # Cloud Run provides the port to listen on
  port: ${PORT:8080}

spring:
  cloud:
    gcp:
      secretmanager:
        enabled: false
      core:
        enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/dash
    username: postgres
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
  liquibase:
    contexts: dev
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 3s
    serviceclient:
      airparif:
        base-url: http://localhost:5000/airParif
        default-header:
          X-Api-Key: test
      openweather:
        base-url: http://localhost:5000/openweatherapi
      steam:
        base-url: http://localhost:5000/steam
      strava:
        base-url: http://localhost:5000/strava
  threads:
    virtual:
      enabled: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

springdoc:
  api-docs:
    path: /api-docs

dash:
  security:
    allowed-origins: http://localhost:4200
    jwt:
      # Base64-encoded HMAC key
      secret: JwtSuperExtraEncryptedSecretKeyJwtSuperExtraEncryptedSecretKeyJwtSuperExtraEncryptedSecretKey
      expiration: 2d
  api:
    openweather:
      key: test
    steam:
      key: test
    strava:
      client-id: test
      client-secret: test
